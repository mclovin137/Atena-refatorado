# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Preparação validável; criação remota depende de Neon autenticado e plano gratuito confirmado.
# DB_URL: JDBC Neon sem opções que enfraqueçam TLS; perfil usa verify-full e truststore Java.
# URLs recíprocas: HTTPS público atribuído pelo Render; sem DNS privado ou valores presumidos.
services:
  - type: web
    name: atena-escolar
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/mclovin137/Atena-refatorado
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: "off"
    envVars:
      - key: SERVICE
        value: escolar
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60.0
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: REPORTS_URL
        sync: false
      - key: IMPORT_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: web
    name: atena-relatorios
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/mclovin137/Atena-refatorado
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: "off"
    envVars:
      - key: SERVICE
        value: relatorios
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60.0
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: SCHOOL_URL
        sync: false
  - type: web
    name: atena-legado
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/mclovin137/Atena-refatorado
    branch: main
    dockerfilePath: ./legacy/Dockerfile
    dockerContext: ./legacy
    healthCheckPath: /health.php
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8080"
      - key: LEGADO_ENV
        value: production
      - key: LEGADO_COOKIE_SECURE
        value: "true"
      - key: LEGADO_BASE_URL
        sync: false
      - key: LEGADO_DB_DSN
        sync: false
      - key: LEGADO_DB_USER
        sync: false
      - key: LEGADO_DB_PASSWORD
        sync: false
