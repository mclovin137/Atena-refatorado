[extend]
useDefault = true

# Arquivo local de credenciais gerado e ignorado. revisar.sh proíbe seu
# versionamento antes de aplicar esta exclusão ao scanner de diretório.
[[allowlists]]
description = "Credenciais operacionais locais não versionadas"
paths = [
  '''^\.env$''',
  '''^\.env\.neon$''',
  '''^\.env\.producao$''',
  '''^\.env\.render\.(escolar|relatorios|legado)$''',
  '''^\.atena-cloud-private/''',
]
