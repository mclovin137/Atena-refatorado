ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    AllowOverride None
    Options -Indexes -ExecCGI
    Require all granted
    DirectoryIndex index.php
    RewriteEngine On
    # Bloqueia também arquivos inexistentes, antes do fallback para index.php.
    RewriteRule ^(?:Views/(?:pages|includes|pdf|uploads)|Lib|Controller|infra|bin|tests)(?:/|$) - [F,L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ index.php?url=$1 [QSA,L]
</Directory>
<Directory /var/www/html/Views/pages>
    Require all denied
</Directory>
<Directory /var/www/html/Views/includes>
    Require all denied
</Directory>
<Directory /var/www/html/Views/pdf>
    Require all denied
</Directory>
<Directory /var/www/html/Views/uploads>
    Require all denied
</Directory>
<Directory /var/www/html/Lib>
    Require all denied
</Directory>
<Directory /var/www/html/Controller>
    Require all denied
</Directory>
<Directory /var/www/html/infra>
    Require all denied
</Directory>
<Directory /var/www/html/Models>
    Require all denied
</Directory>
<Directory /var/www/html/Models/ajax>
    Require all granted
</Directory>
<Directory /var/www/html/Models/pdf>
    Require all granted
</Directory>
<FilesMatch "^(config\.php|composer\.(json|lock)|Dockerfile|\..*)$">
    Require all denied
</FilesMatch>

<Directory /var/www/html/bin>
    Require all denied
</Directory>
<Directory /var/www/html/tests>
    Require all denied
</Directory>
