spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: escolar-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/escolar}
    username: ${DB_USER:escolar}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
atena:
  service-token: ${SERVICE_TOKEN}
  reports-url: ${REPORTS_URL:http://localhost:8081}
